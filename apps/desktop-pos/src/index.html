<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Food POS - 오프라인 단말</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px; color: #172033; background: #f4f6f8; font-family: "Malgun Gothic", sans-serif; }
    main { max-width: 920px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .muted { color: #667085; }
    .panel { margin-top: 24px; padding: 24px; background: white; border: 1px solid #e4e7ec; border-radius: 14px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .metric { padding: 16px; background: #f8fafc; border-radius: 10px; }
    .metric strong { display: block; margin-top: 8px; font-size: 24px; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid #d0d5dd; border-radius: 8px; font: inherit; }
    textarea { min-height: 70px; resize: vertical; }
    button { margin-top: 16px; padding: 12px 18px; border: 0; border-radius: 8px; color: white; background: #175cd3; font: inherit; font-weight: 700; cursor: pointer; }
    #result { margin-left: 12px; color: #067647; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>Food POS 데스크톱 기반</h1>
    <p class="muted">로컬 SQLite 저장소가 준비되었습니다. 이 화면은 오프라인 저장 기능의 개발·검증용 초기 화면입니다.</p>
    <section class="panel">
      <h2>단말기 및 로컬 저장 상태</h2>
      <div class="grid">
        <div class="metric">로컬 주문 수<strong id="order-count">-</strong></div>
        <div class="metric">동기화 대기<strong id="pending-count">-</strong></div>
        <div class="metric">마지막 동기화<strong id="last-sync">없음</strong></div>
      </div>
      <p class="muted">단말기 ID: <code id="device-id">확인 중</code></p>
      <p class="muted">DB 파일: <code id="db-path">확인 중</code></p>
    </section>
    <section class="panel">
      <h2>오프라인 주문 저장 테스트</h2>
      <p class="muted">테스트용 주문을 로컬 DB에 저장하고 주문·주문항목·동기화 Outbox가 하나의 트랜잭션으로 기록되는지 확인합니다.</p>
      <label for="tenant">Tenant ID</label><input id="tenant" placeholder="테스트용 tenant UUID" />
      <label for="store">Store ID</label><input id="store" placeholder="테스트용 store UUID" />
      <label for="menu">메뉴명</label><input id="menu" value="오프라인 테스트 메뉴" />
      <label for="price">단가 (원)</label><input id="price" type="number" min="0" value="9000" />
      <label for="quantity">수량</label><input id="quantity" type="number" min="1" value="1" />
      <label for="type">주문 유형</label>
      <select id="type"><option value="DINE_IN">매장 식사</option><option value="TAKEOUT">포장</option></select>
      <label for="table">테이블명 (선택)</label><input id="table" placeholder="예: 홀-1" />
      <label for="note">요청사항 (선택)</label><textarea id="note"></textarea>
      <button id="save">로컬 주문 저장</button><span id="result" role="status"></span>
    </section>
  </main>
  <script src="./renderer.js"></script>
</body>
</html>
